<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearthgrove • Survival SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0f1a14] text-white">

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 bg-[#0f1a14] z-[9999] flex items-center justify-center">
        <div class="text-center">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-br from-[#E8B86D] to-[#8B5E3C] rounded-3xl flex items-center justify-center animate-pulse">
                    <i class="fa-solid fa-tree text-5xl text-[#1a2f1f]"></i>
                </div>
            </div>
            <div class="text-3xl font-bold text-[#E8B86D]">Loading Hearthgrove...</div>
            <div class="mt-4 w-64 h-1 bg-[#3a4a3a] rounded-full mx-auto overflow-hidden">
                <div class="h-full bg-[#E8B86D] animate-[loading_1.5s_ease-in-out_infinite]"></div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="opacity-0 transition-opacity duration-700">

        <!-- Hero Section -->
        <div class="min-h-screen bg-cover bg-center flex flex-col items-center justify-center relative" 
             style="background-image: linear-gradient(rgba(15,26,20,0.85), rgba(15,26,20,0.9)), url('https://picsum.photos/id/1015/1920/1080')">
            
            <div class="text-center px-6">
                <div class="flex justify-center mb-8">
                    <div class="flex items-center gap-x-5">
                        <div class="w-24 h-24 bg-gradient-to-br from-[#E8B86D] to-[#8B5E3C] rounded-3xl flex items-center justify-center shadow-2xl">
                            <i class="fa-solid fa-tree text-6xl text-[#1a2f1f]"></i>
                        </div>
                        <div class="w-24 h-24 bg-gradient-to-br from-[#8B5E3C] to-[#E8B86D] rounded-3xl flex items-center justify-center shadow-2xl -mt-8">
                            <i class="fa-solid fa-fire text-6xl text-white"></i>
                        </div>
                    </div>
                </div>

                <h1 class="text-[100px] md:text-[130px] font-black tracking-[-6px] text-[#E8B86D]">HEARTHGROVE</h1>
                <p class="text-4xl -mt-4 text-white tracking-[4px]">SURVIVAL SMP</p>
                
                <p class="mt-6 max-w-md mx-auto text-xl text-[#b8c9b9]">A cozy place to build, explore, and belong.</p>
            </div>

            <!-- 3 Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl px-6 mt-16">
                <a href="#" class="v2-card bg-[#1a2f1f] border border-[#3a4a3a] rounded-3xl p-9 text-center">
                    <div class="w-20 h-20 bg-[#5865F2] rounded-3xl mx-auto flex items-center justify-center mb-6">
                        <i class="fa-brands fa-discord text-white text-5xl"></i>
                    </div>
                    <div class="text-3xl font-bold">Discord</div>
                </a>
                
                <a href="#" class="v2-card bg-[#1a2f1f] border border-[#3a4a3a] rounded-3xl p-9 text-center">
                    <div class="w-20 h-20 bg-[#E8B86D] rounded-3xl mx-auto flex items-center justify-center mb-6">
                        <i class="fa-solid fa-vote-yea text-[#1a2f1f] text-5xl"></i>
                    </div>
                    <div class="text-3xl font-bold">Vote</div>
                </a>
                
                <a href="#" class="v2-card bg-[#1a2f1f] border border-[#3a4a3a] rounded-3xl p-9 text-center">
                    <div class="w-20 h-20 bg-[#3a4a3a] rounded-3xl mx-auto flex items-center justify-center mb-6">
                        <i class="fa-solid fa-calendar text-[#E8B86D] text-5xl"></i>
                    </div>
                    <div class="text-3xl font-bold">Events</div>
                </a>
            </div>
        </div>

        <!-- Bottom Join Bar -->
        <div class="bg-[#1a2f1f] py-8 border-t border-[#3a4a3a]">
            <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-y-5">
                <div>
                    <div class="text-xl">Ready to come home?</div>
                    <div class="font-mono text-4xl text-[#E8B86D]">hg.dg.vg</div>
                </div>
                
                <button onclick="copyIP()" 
                        class="flex items-center gap-x-3 bg-[#E8B86D] hover:bg-[#d4a75a] text-[#1a2f1f] px-10 py-4 rounded-3xl font-bold text-xl transition-all active:scale-95">
                    <span>Join Now</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#1a2f1f] border border-[#E8B86D] px-8 py-3.5 rounded-2xl flex items-center gap-x-3 z-50">
        <i class="fa-solid fa-check text-[#E8B86D]"></i>
        <span>IP copied to clipboard!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
